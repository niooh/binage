[package]
name = "binage"
version = "0.1.0"
description = "A tiny cross-platform manager for portable binaries"
license = "MIT"
edition = "2021"
build = "scripts/build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_UI",
    "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = 3
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
